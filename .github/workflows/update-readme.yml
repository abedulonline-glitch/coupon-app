name: 📝 Auto Update README

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 📊 Collect Repo Stats
        id: stats
        run: |
          echo "date=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT
          
          STOCK_LINES=$(wc -l < stock-beta.html 2>/dev/null || echo 0)
          BETA_LINES=$(wc -l < beta.html 2>/dev/null || echo 0)
          SUPER_LINES=$(wc -l < super-beta.html 2>/dev/null || echo 0)
          I18N_LINES=$(wc -l < i18n.js 2>/dev/null || echo 0)
          
          echo "stock_lines=$STOCK_LINES" >> $GITHUB_OUTPUT
          echo "beta_lines=$BETA_LINES" >> $GITHUB_OUTPUT
          echo "super_lines=$SUPER_LINES" >> $GITHUB_OUTPUT
          echo "i18n_lines=$I18N_LINES" >> $GITHUB_OUTPUT
          
          git log -5 --pretty=format:"| %ad | %s | \`%h\` |" --date=short > /tmp/recent.txt
          echo "recent_commits<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/recent.txt >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: 🧹 Remove Old Auto-Sections
        run: |
          python3 << 'PYEOF'
          import re
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()
          patterns = [
              r'<!-- AUTO:START -->.*?<!-- AUTO:END -->',
              r'<!-- AUTO_STATS:START -->.*?<!-- AUTO_STATS:END -->',
              r'<!-- AUTO_RECENT:START -->.*?<!-- AUTO_RECENT:END -->',
          ]
          for pattern in patterns:
              content = re.sub(pattern, '', content, flags=re.DOTALL)
          content = re.sub(r'\n{3,}', '\n\n', content)
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(content)
          print("✅ Old auto-sections removed")
          PYEOF
      
      - name: 📝 Add Auto-Sections to README
        run: |
          python3 << 'PYEOF'
          import os
          date = os.environ.get('DATE', 'N/A')
          stock_lines = os.environ.get('STOCK_LINES', '0')
          beta_lines = os.environ.get('BETA_LINES', '0')
          super_lines = os.environ.get('SUPER_LINES', '0')
          i18n_lines = os.environ.get('I18N_LINES', '0')
          recent = os.environ.get('RECENT_COMMITS', '')
          
          auto_section = f"""

---

<!-- AUTO:START -->
## 🤖 Auto-Generated Info

**Last Updated:** {date}

<!-- AUTO_STATS:START -->
### 📊 File Statistics

| File | Lines |
|:---|:---|
| `stock-beta.html` | {stock_lines} |
| `beta.html` | {beta_lines} |
| `super-beta.html` | {super_lines} |
| `i18n.js` | {i18n_lines} |
<!-- AUTO_STATS:END -->

<!-- AUTO_RECENT:START -->
### 📅 Recent Commits

| Date | Message | Commit |
|:---|:---|:---|
{recent}
<!-- AUTO_RECENT:END -->

---

**🤖 This section is auto-updated on every push.**
<!-- AUTO:END -->
"""
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()
          content = content.rstrip() + '\n' + auto_section
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(content)
          print("✅ Auto-section added")
          PYEOF
        env:
          DATE: ${{ steps.stats.outputs.date }}
          STOCK_LINES: ${{ steps.stats.outputs.stock_lines }}
          BETA_LINES: ${{ steps.stats.outputs.beta_lines }}
          SUPER_LINES: ${{ steps.stats.outputs.super_lines }}
          I18N_LINES: ${{ steps.stats.outputs.i18n_lines }}
          RECENT_COMMITS: ${{ steps.stats.outputs.recent_commits }}
      
      - name: ✅ Check for Changes
        id: check
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: 🚀 Commit & Push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "docs: auto-update README [skip ci] [skip pages]"
          git push
