<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adhesive Coupon System</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
  .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
</style>
</head>
<body>

<h2>Coupon System (Firebase Test)</h2>
<div class="card">
  <p id="status">Firebase লোড হচ্ছে...</p>
  <button onclick="testFirebase()">Firebase টেস্ট করুন</button>
  <ul id="couponList"></ul>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


  const firebaseConfig = {
  apiKey: "AIzaSyBZCFgugZCLuyryQiuLYY-HjBin6QeFQd0",
  authDomain: "couponsystem-7c625.firebaseapp.com",
  projectId: "couponsystem-7c625",
  storageBucket: "couponsystem-7c625.firebasestorage.app",
  messagingSenderId: "211989339411",
  appId: "1:211989339411:web:5efe34a6db6b006b434ee6",
  measurementId: "G-76WETNMGGL"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  document.getElementById('status').innerText = "✅ Firebase সংযুক্ত হয়েছে!";

  window.testFirebase = async function() {
    await addDoc(collection(db, "coupons"), {
      code: "CUPN-TEST001-T1A",
      grade: "T1_20Kg",
      amount: 25,
      status: "unused",
      createdAt: new Date()
    });
    alert("✅ ডেটা সেভ হয়েছে!");

    const q = query(collection(db, "coupons"), orderBy("createdAt", "desc"));
    const snap = await getDocs(q);
    const list = document.getElementById('couponList');
    list.innerHTML = "";
    snap.forEach(doc => {
      const d = doc.data();
      list.innerHTML += `<li>${d.code} - ₹${d.amount} (${d.grade})</li>`;
    });
  };
</script>

</body>
</html>
